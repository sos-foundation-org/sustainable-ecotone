<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ecotone mark, simplified for 16–32px: a hand lens on paper, a cinnabar tide line,
       hatched water below, and a 水筆仔 propagule crossing the edge. Matches #mark in EngraveDefs. -->
  <defs>
    <clipPath id="lens"><circle cx="16" cy="16" r="11.6"/></clipPath>
    <pattern id="h" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <rect width="2.2" height="2.2" fill="#F2ECDF"/>
      <rect width="2.2" height=".9" fill="#1C1A17" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="32" height="32" rx="7" fill="#F2ECDF"/>
  <g clip-path="url(#lens)">
    <path d="M2 17.6C6.5 15.4 9.5 19.6 16 17.4C22.5 15.2 25.5 19.6 30 17.4V30H2Z" fill="url(#h)"/>
    <path d="M2 17.6C6.5 15.4 9.5 19.6 16 17.4C22.5 15.2 25.5 19.6 30 17.4" fill="none" stroke="#A8321F" stroke-width="1.6"/>
    <path d="M16 5.2C14.6 11.5 14.6 19.8 16 26.8C17.4 19.8 17.4 11.5 16 5.2Z" fill="#F2ECDF" stroke="#1C1A17" stroke-width="1.15" stroke-linejoin="round"/>
  </g>
  <circle cx="16" cy="16" r="12.6" fill="none" stroke="#1C1A17" stroke-width="2"/>
</svg>
